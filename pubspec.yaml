name: dnd_helper
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  flutter:
    sdk: flutter
  graphql: ^5.2.3
  flutter_riverpod: ^3.1.0
  firebase_auth: ^6.1.2
  firebase_core: ^4.4.0
  equatable: ^2.0.7
  liquid_glass_renderer: ^0.2.0-dev.4
  image_picker: ^1.2.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  go_router: ^17.0.1
  flutter_native_splash: ^2.4.7
  http: ^1.6.0
  riverpod_annotation: ^4.0.0
  riverpod: ^3.1.0
  cloud_firestore: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  graphql_codegen: ^3.0.0
  build_runner: ^2.10.4
  riverpod_generator: ^4.0.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Pixelify
      fonts:
        - asset: fonts/PixelifySans-Regular.ttf
        - asset: fonts/PixelifySans-Medium.ttf
        - asset: fonts/PixelifySans-Semibold.ttf
        - asset: fonts/PixelifySans-Bold.ttf
    - family: Jersey
      fonts:
        - asset: fonts/Jersey15-Regular.ttf
    - family: Dung
      fonts:
        - asset: fonts/dung.ttf

flutter_native_splash:
  ios: false

  background_image: "assets/tower.png"
  fullscreen: true

  android_12:
    color: "#1E1E1E"
    image: assets/tower.png
    icon_background_color: "#1E1E1E"